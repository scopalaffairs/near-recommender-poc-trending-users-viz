<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>NEAR trending users</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
    }

    #panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      color: #cfd8e3;
      font-size: 13px;
    }

    #panel button {
      display: block;
      margin-bottom: 4px;
      padding: 6px 10px;
      border: 1px solid #3a4a5e;
      border-radius: 4px;
      background: #0b1624cc;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    #panel button.active {
      border-color: #ffd24a;
      color: #ffd24a;
    }

    #stats {
      margin-top: 8px;
      line-height: 1.5;
    }
  </style>

  <!-- All versions are pinned: unpinned unpkg URLs broke this page when three went ESM-only. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/",
        "3d-force-graph": "https://esm.sh/3d-force-graph@1.74.5?external=three&deps=three-forcegraph@1.42.11,three-render-objects@1.29.5"
      }
    }
  </script>
</head>

<body>
  <div id="panel">
    <div id="buttons"></div>
    <div id="stats"></div>
  </div>
  <div id="graph"></div>

  <script type="module">
    import ForceGraph3D from '3d-force-graph';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // Original dataset plus follow-graph snapshots of the same 20 anchor accounts (see pipeline/).
    const SNAPSHOTS = [
      { label: 'Original (Frühjahr 2023)', file: './trending_users.json' },
      { label: '15.04.2023 – vor Recommender', file: './data/trending_users_2023-04-15.json' },
      { label: '31.10.2023 – kurz vor Launch', file: './data/trending_users_2023-10-31.json' },
      { label: '15.01.2024 – nach Recommender', file: './data/trending_users_2024-01-15.json' },
    ];

    // Community colors: 0 Aurora, 1 Root-Userbase, 4 Mintbase/NDC, 5 JumpDeFi/Neko, 9 NEARxART
    const GROUP_COLORS = { 0: '#ff5c7a', 1: '#4aa8ff', 4: '#4fd6a0', 5: '#b583ff', 9: '#ff9f4a' };
    const BRIDGE_COLOR = '#ffd24a';

    const graph = ForceGraph3D()(document.getElementById('graph'))
      .backgroundColor('#0011')
      .nodeVal(node => 1 + (node.auth || 0) * 80)
      .nodeColor(node => node.bridge ? BRIDGE_COLOR : GROUP_COLORS[node.cluster] || '#8a97ab')
      .linkColor(() => 'rgba(200, 200, 200, 0.4)')
      .nodeLabel('id')
      .onNodeDragEnd(node => {
        node.fx = node.x;
        node.fy = node.y;
        node.fz = node.z;
      })
      .onNodeClick(node => {
        // Aim at node from outside it
        const distance = 40;
        const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);

        graph.cameraPosition(
          { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio }, // new position
          node, // lookAt ({ x, y, z })
          3000  // ms transition duration
        );
      })
      .linkDirectionalParticleColor(() => 'cyan')
      .linkDirectionalParticleWidth(6)
      .linkHoverPrecision(10)
      .onLinkClick(link => graph.emitParticle(link));

    const bloomPass = new UnrealBloomPass();
    bloomPass.strength = 0.8;
    bloomPass.radius = 1.3;
    bloomPass.threshold = 0.2;
    graph.postProcessingComposer().addPass(bloomPass);

    const buttons = document.getElementById('buttons');
    const stats = document.getElementById('stats');

    async function show(index) {
      const data = await fetch(SNAPSHOTS[index].file).then(res => res.json());
      const byId = new Map(data.nodes.map(node => [node.id, node]));
      data.nodes.forEach(node => { if (node.group !== 1000) node.cluster = node.group; });
      data.links.forEach(link => {
        const source = byId.get(link.source), target = byId.get(link.target);
        if (source.group === 1000 && source.cluster === undefined) source.cluster = target.group;
      });
      const bridges = data.nodes.filter(node => node.bridge).length;
      graph.graphData(data);
      [...buttons.children].forEach((button, i) => button.classList.toggle('active', i === index));
      stats.innerHTML = `${data.nodes.length} Knoten · ${data.links.length} Kanten`
        + (bridges ? `<br>${bridges} Brücken-Accounts (golden), folgen ≥ 2 Communities` : '');
    }

    SNAPSHOTS.forEach((snapshot, i) => {
      const button = document.createElement('button');
      button.textContent = snapshot.label;
      button.onclick = () => show(i);
      buttons.appendChild(button);
    });
    show(1);
  </script>
</body>

</html>
