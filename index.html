<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>NEAR trending users</title>
  <style>
    body {
      margin: 0;
    }
  </style>

  <!-- All versions are pinned: unpinned unpkg URLs broke this page when three went ESM-only. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/",
        "3d-force-graph": "https://esm.sh/3d-force-graph@1.74.5?external=three&deps=three-forcegraph@1.42.11,three-render-objects@1.29.5"
      }
    }
  </script>
</head>

<body>
  <div id="graph"></div>

  <script type="module">
    import ForceGraph3D from '3d-force-graph';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const data = await fetch('./trending_users.json').then(res => res.json());

    const graph = ForceGraph3D()(document.getElementById('graph'))
      .graphData(data)
      .backgroundColor('#0011')
      .linkColor(() => 'rgba(200, 200, 200, 0.4)')
      .nodeLabel('id')
      .nodeAutoColorBy('group')
      .onNodeDragEnd(node => {
        node.fx = node.x;
        node.fy = node.y;
        node.fz = node.z;
      })
      .onNodeClick(node => {
        // Aim at node from outside it
        const distance = 40;
        const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);

        graph.cameraPosition(
          { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio }, // new position
          node, // lookAt ({ x, y, z })
          3000  // ms transition duration
        );
      })
      .linkDirectionalParticleColor(() => 'cyan')
      .linkDirectionalParticleWidth(6)
      .linkHoverPrecision(10)
      .onLinkClick(link => graph.emitParticle(link));

    const bloomPass = new UnrealBloomPass();
    bloomPass.strength = 0.8;
    bloomPass.radius = 1.3;
    bloomPass.threshold = 0.2;
    graph.postProcessingComposer().addPass(bloomPass);
  </script>
</body>

</html>
